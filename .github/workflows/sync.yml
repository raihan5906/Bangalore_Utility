name: Run Bangalore Utility Tracker

on:
  schedule:
    # Runs every 60 minutes, 24/7 (UTC timezone)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub website if needed

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up subsequent runs

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 gspread oauth2client python-dotenv lxml

    - name: Execute Utility Tracker Pipeline
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        GOOGLE_SHEETS_CREDS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDS_JSON }}
      run: python tracker.py